name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify manifest
        run: pnpm verify:manifest

      - name: Verify no remote code
        run: pnpm verify:no-remote-code

      - name: Package
        run: pnpm package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: sap-btp-workzone-kit-extension
          path: artifacts/*.zip
          if-no-files-found: error
